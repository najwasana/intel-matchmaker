<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background glow filter -->
    <filter id="heart-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Deep outer drop shadow -->
    <filter id="heart-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C1D95" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>

    <!-- Main 3D dimensional gradient -->
    <linearGradient id="heart-grad-base" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="18%" stop-color="#F472B6"/>
      <stop offset="42%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="92%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <!-- Inner dimensional shadow / cavity gradient -->
    <radialGradient id="heart-depth-radial" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#F472B6" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#9333EA" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#3B0764" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E0538" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Upper specular highlight gloss gradient -->
    <linearGradient id="gloss-highlight-1" x1="20%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#FCE7F3" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gloss-highlight-2" x1="70%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#E9D5FF" stop-opacity="0.25"/>
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Rim iridescent light gradient -->
    <linearGradient id="rim-light" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#C084FC" stop-opacity="0"/>
      <stop offset="80%" stop-color="#F472B6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backlight Pulsing Halo -->
  <g class="heart-halo-group">
    <path d="M 200,340 C 130,280 40,200 40,125 C 40,65 85,30 145,30 C 175,30 190,50 200,65 C 210,50 225,30 255,30 C 315,30 360,65 360,125 C 360,200 270,280 200,340 Z"
          fill="url(#heart-grad-base)" opacity="0.35" filter="url(#heart-glow)"/>
  </g>

  <!-- Main Dimensional Heart Body with Drop Shadow -->
  <g filter="url(#heart-shadow)">
    <!-- Base Heart Shape -->
    <path id="base-heart-path"
          d="M 200,345 C 135,285 45,205 45,130 C 45,72 88,38 145,38 C 174,38 189,55 200,70 C 211,55 226,38 255,38 C 312,38 355,72 355,130 C 355,205 265,285 200,345 Z"
          fill="url(#heart-grad-base)"/>

    <!-- Depth & Spherical Ambient Occlusion Layer -->
    <path d="M 200,345 C 135,285 45,205 45,130 C 45,72 88,38 145,38 C 174,38 189,55 200,70 C 211,55 226,38 255,38 C 312,38 355,72 355,130 C 355,205 265,285 200,345 Z"
          fill="url(#heart-depth-radial)" mix-blend-mode="multiply"/>

    <!-- Cyber / Tech Subtle Core Ring Motif inside heart -->
    <g opacity="0.32" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <circle cx="200" cy="165" r="48" stroke-dasharray="6 4"/>
      <circle cx="200" cy="165" r="32" stroke-dasharray="3 3"/>
      <path d="M 152,165 H 248 M 200,117 V 213" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="200" cy="165" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Edge / Rim Iridescent Sheen -->
    <path d="M 200,345 C 135,285 45,205 45,130 C 45,72 88,38 145,38 C 174,38 189,55 200,70 C 211,55 226,38 255,38 C 312,38 355,72 355,130 C 355,205 265,285 200,345 Z"
          fill="none" stroke="url(#rim-light)" stroke-width="3.5" opacity="0.85"/>

    <!-- Left High Gloss Specular Reflection (Curved pill highlight) -->
    <path d="M 142,52 C 105,52 72,78 70,118 C 68,146 84,178 114,212 C 117,215 120,210 118,206 C 96,176 86,146 88,122 C 90,88 114,66 142,66 C 158,66 172,74 180,84 C 183,88 187,86 186,81 C 177,65 161,52 142,52 Z"
          fill="url(#gloss-highlight-1)"/>

    <!-- Secondary Left Specular Micro-Dot -->
    <ellipse cx="98" cy="115" rx="6" ry="12" transform="rotate(-25 98 115)" fill="#FFFFFF" opacity="0.85"/>

    <!-- Right Shoulder Specular Soft Crescent -->
    <path d="M 256,54 C 285,54 316,74 324,108 C 328,124 322,144 310,165 C 308,168 312,172 315,168 C 329,146 336,124 332,105 C 323,66 288,48 255,48 C 242,48 230,53 222,60 C 219,63 222,67 225,65 C 234,58 245,54 256,54 Z"
          fill="url(#gloss-highlight-2)"/>

    <!-- Bottom Tip Subtle Up-bounce Light -->
    <path d="M 180,315 C 193,332 200,338 200,338 C 200,338 207,332 220,315 C 208,322 192,322 180,315 Z"
          fill="#38BDF8" opacity="0.6"/>
  </g>

  <!-- Sparkle Stars surrounding heart -->
  <g class="sparkles-group" fill="#FFFFFF">
    <!-- Top-Right Sparkle -->
    <path d="M 330,55 Q 330,70 345,70 Q 330,70 330,85 Q 330,70 315,70 Q 330,70 330,55 Z" opacity="0.95"/>
    <circle cx="330" cy="70" r="2" fill="#F472B6"/>

    <!-- Bottom-Left Sparkle -->
    <path d="M 65,240 Q 65,250 75,250 Q 65,250 65,260 Q 65,250 55,250 Q 65,250 65,240 Z" opacity="0.85"/>

    <!-- Top-Left Micro Sparkle -->
    <path d="M 95,30 Q 95,38 103,38 Q 95,38 95,46 Q 95,38 87,38 Q 95,38 95,30 Z" opacity="0.75"/>
  </g>
</svg>
