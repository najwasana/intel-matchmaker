<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="processor-possibilities-svg" aria-label="Intel Processor Architecture and Human Possibilities">
  <defs>
    <filter id="proc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="wafer-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#17142B" />
      <stop offset="100%" stop-color="#0F0D1A" />
    </linearGradient>

    <linearGradient id="branch-creative" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="branch-gaming" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="branch-learn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="branch-ideas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
  </defs>

  <!-- Central Processor Die Package -->
  <g class="central-processor-die" transform="translate(400, 250)">
    <!-- Substrate Base -->
    <rect x="-85" y="-85" width="170" height="170" rx="18" fill="url(#wafer-gradient)" stroke="#7C3AED" stroke-width="2.5" filter="url(#proc-glow)" />
    <!-- Die Shield Interconnects -->
    <rect x="-65" y="-65" width="130" height="130" rx="10" fill="#241B3B" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8,4" />
    <!-- Silicon Core Die (Intel 18A Node) -->
    <rect x="-42" y="-42" width="84" height="84" rx="8" fill="#17142B" stroke="#C084FC" stroke-width="2" />
    <!-- Center Intel 18A text and logo mark -->
    <circle cx="0" cy="-6" r="14" fill="#7C3AED" opacity="0.6" filter="url(#proc-glow)" />
    <text x="0" y="-1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Intel</text>
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">18A</text>
  </g>

  <!-- Bus Lines branching outward to 4 Human Dimensions -->
  <!-- Branch 1: Top-Left -> Digital Creativity (Video, 3D, Design) -->
  <g class="possibility-branch branch-1" stroke="url(#branch-creative)" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#proc-glow)">
    <path d="M 335,210 L 250,210 L 210,130 L 140,130" />
    <path d="M 335,230 L 270,230 L 230,150 L 160,150" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Branch 2: Top-Right -> Gaming with Friends & Virtual Worlds -->
  <g class="possibility-branch branch-2" stroke="url(#branch-gaming)" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#proc-glow)">
    <path d="M 465,210 L 550,210 L 590,130 L 660,130" />
    <path d="M 465,230 L 530,230 L 570,150 L 640,150" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Branch 3: Bottom-Left -> Learning, Research & Knowledge -->
  <g class="possibility-branch branch-3" stroke="url(#branch-learn)" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#proc-glow)">
    <path d="M 335,290 L 250,290 L 200,370 L 140,370" />
    <path d="M 350,315 L 280,315 L 230,390 L 160,390" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Branch 4: Bottom-Right -> Building Big Ideas & Innovation -->
  <g class="possibility-branch branch-4" stroke="url(#branch-ideas)" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#proc-glow)">
    <path d="M 465,290 L 550,290 L 600,370 L 660,370" />
    <path d="M 450,315 L 520,315 L 570,390 L 640,390" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Four Human Possibility Hubs (Cards / Orbs) -->
  <!-- Hub 1: Digital Creativity -->
  <g class="possibility-hub hub-1" transform="translate(110, 130)">
    <circle cx="0" cy="0" r="32" fill="#1E1B4B" stroke="#F472B6" stroke-width="2" filter="url(#proc-glow)" />
    <!-- Creativity Palette Icon -->
    <path d="M -10,-8 C -5,-14 6,-14 11,-8 C 15,-3 14,8 7,11 C 4,12 2,10 2,8 C 2,6 3,5 2,4 C 0,3 -4,3 -6,5 C -11,8 -14,2 -10,-8 Z" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round" />
    <circle cx="-3" cy="-4" r="1.5" fill="#38BDF8" />
    <circle cx="4" cy="-3" r="1.5" fill="#C084FC" />
    <circle cx="6" cy="4" r="1.5" fill="#F472B6" />
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle">Creation &amp; Art</text>
  </g>

  <!-- Hub 2: Gaming & Connection -->
  <g class="possibility-hub hub-2" transform="translate(690, 130)">
    <circle cx="0" cy="0" r="32" fill="#1E1B4B" stroke="#38BDF8" stroke-width="2" filter="url(#proc-glow)" />
    <!-- Controller Icon -->
    <rect x="-14" y="-8" width="28" height="16" rx="6" fill="none" stroke="#38BDF8" stroke-width="2" />
    <line x1="-9" y1="0" x2="-3" y2="0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="-6" y1="-3" x2="-6" y2="3" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <circle cx="6" cy="-2" r="1.5" fill="#F472B6" />
    <circle cx="9" cy="2" r="1.5" fill="#C084FC" />
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle">Gaming &amp; Worlds</text>
  </g>

  <!-- Hub 3: Learning & Research -->
  <g class="possibility-hub hub-3" transform="translate(110, 370)">
    <circle cx="0" cy="0" r="32" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2" filter="url(#proc-glow)" />
    <!-- Book / Knowledge Icon -->
    <path d="M 0,-6 C -6,-10 -12,-9 -14,-7 L -14,8 C -12,6 -6,7 0,10 C 6,7 12,6 14,8 L 14,-7 C 12,-9 6,-10 0,-6 Z" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linejoin="round" />
    <line x1="0" y1="-6" x2="0" y2="10" stroke="#A78BFA" stroke-width="2" />
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle">Study &amp; Discovery</text>
  </g>

  <!-- Hub 4: Building Big Ideas -->
  <g class="possibility-hub hub-4" transform="translate(690, 370)">
    <circle cx="0" cy="0" r="32" fill="#1E1B4B" stroke="#F472B6" stroke-width="2" filter="url(#proc-glow)" />
    <!-- Lightbulb / Spark Innovation Icon -->
    <path d="M -7,-5 C -7,-9 -4,-12 0,-12 C 4,-12 7,-9 7,-5 C 7,-2 5,0 4,2 L -4,2 C -5,0 -7,-2 -7,-5 Z" fill="none" stroke="#F472B6" stroke-width="2" />
    <line x1="-3" y1="6" x2="3" y2="6" stroke="#F472B6" stroke-width="2" stroke-linecap="round" />
    <line x1="-2" y1="9" x2="2" y2="9" stroke="#F472B6" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle">Your Next Big Thing</text>
  </g>

  <!-- Circuit Traveling Packets -->
  <circle cx="0" cy="0" r="3" fill="#FFFFFF">
    <animateMotion path="M 335,210 L 250,210 L 210,130 L 140,130" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="0" r="3" fill="#FFFFFF">
    <animateMotion path="M 465,210 L 550,210 L 590,130 L 660,130" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="0" r="3" fill="#FFFFFF">
    <animateMotion path="M 335,290 L 250,290 L 200,370 L 140,370" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="0" r="3" fill="#FFFFFF">
    <animateMotion path="M 465,290 L 550,290 L 600,370 L 660,370" dur="2.3s" repeatCount="indefinite" />
  </circle>
</svg>
